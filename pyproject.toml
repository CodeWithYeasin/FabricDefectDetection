[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabricnet"
version = "2.0.0"
description = "SpecTexNet: spectral-residual guided fabric defect classification with a leakage-free evaluation protocol"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "torch>=2.2", "torchvision>=0.17", "timm>=1.0.9", "safetensors>=0.4", "numpy>=1.24",
  "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "pillow>=10.0", "matplotlib>=3.8", "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
